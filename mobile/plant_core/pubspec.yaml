name: plant_core
description: The shared core of the plant app (docs/vision-system/PLANT-DASHBOARD-AND-MOBILE.md 6.1-6.2) - theme in light and dark, sounds, charts and the settings every product module uses.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.8.1
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  # Click and alert sounds (lib/src/audio.dart), made by tool/make_sounds.py.
  assets:
    - assets/sounds/
