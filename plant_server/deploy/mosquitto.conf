# SPI broker settings. Defaults (max_queued_messages 1000) DROP messages when a subscriber falls behind a burst,
# e.g. a gateway flushing a long outage buffer. Sequence-gap detection will show any loss, but avoid it:
listener 1883
allow_anonymous true          # LOCAL EVALUATION ONLY: use a password file + TLS listener for real deployments
persistence true
persistence_location /mosquitto/data/
max_queued_messages 500000
max_inflight_messages 200
message_size_limit 65536
