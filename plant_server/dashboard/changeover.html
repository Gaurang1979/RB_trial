<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Changeover check - Sundaram Smart Production Intelligence</title>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b46;--txt:#e5e9f2;--mut:#8fa0c0;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--acc:#38bdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;background:#0e1730;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.06em;font-size:13px;flex:1}.brand small{display:block;color:var(--mut);font-weight:500;letter-spacing:.02em}
.tab,button,select,input{background:#16213b;border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:6px;font:inherit}
button{cursor:pointer}
main{padding:14px 16px;max-width:1500px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar label{color:var(--mut);font-size:12px;display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:4px}
.why{font-weight:600}.meta{color:var(--mut);font-size:12px}
.code{font:700 15px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;color:var(--acc)}
.badge{display:inline-block;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 7px;text-transform:uppercase;border:1px solid var(--c);color:var(--c)}
table{width:100%;border-collapse:collapse;margin:8px 0}
td,th{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}
th{color:var(--mut);font-weight:500;font-size:12px;width:34%}
tr.chg td,tr.chg th{background:#f59e0b22}
.old{color:var(--bad);text-decoration:line-through}.new{color:var(--ok);font-weight:600}.arrow{color:var(--mut);padding:0 4px}
.first{color:var(--warn);font-size:12px}
.acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.acts button{flex:1;font-weight:700;color:#04121f;border:0;white-space:nowrap}
.b-accept{background:var(--ok)}.b-refuse{background:var(--bad)}
.note{width:100%;margin-top:8px}
.empty-msg{color:var(--mut);padding:20px}
.admin{margin-top:22px;border-top:1px solid var(--line);padding-top:12px}
.admin h2{font-size:14px;margin:0 0 8px}
.set{display:flex;gap:10px;align-items:center;padding:4px 0}
.set span:first-child{min-width:200px}
</style>
</head>
<body>
<header>
  <div class="brand">SUNDARAM SMART PRODUCTION INTELLIGENCE<small>Changeover check: a second person checks the values before the line runs</small></div>
  <button class="tab" id="loginbtn"></button>
</header>
<main>
  <div class="bar">
    <label>Line <select id="fline"><option value="">All lines</option></select></label>
    <label>Show <select id="fstate">
      <option value="pending">Waiting for a check</option><option value="accepted">Accepted</option><option value="refused">Refused</option>
      <option value="superseded">Replaced by a newer request</option><option value="all">All</option></select></label>
    <button id="reload">Refresh</button>
  </div>
  <div class="grid" id="grid"><div class="empty-msg">Loading&hellip;</div></div>
  <section class="admin" id="admin" hidden>
    <h2>Check at changeover (on unless switched off here; a line's own setting wins over its plant's)</h2>
    <div id="settings"></div>
  </section>
</main>
<script>
"use strict";
const P = new URLSearchParams(location.search), KEY = P.get("key");
function authHeaders(){
  const t = localStorage.getItem("spi_token");
  if(t) return {"Authorization": "Bearer " + t};
  if(KEY) return {"X-API-Key": KEY};
  return {};
}
let HDR = authHeaders();
function refreshAuth(){ HDR = authHeaders(); }
function clearSession(){ localStorage.removeItem("spi_token"); localStorage.removeItem("spi_username"); localStorage.removeItem("spi_name"); refreshAuth(); }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const STATE = {pending:["#f59e0b","Waiting for a check"], accepted:["#22c55e","Accepted"], refused:["#ef4444","Refused"], superseded:["#8fa0c0","Replaced by a newer request"]};
let items = [], busy = false;

async function api(path, opt){
  let r = await fetch(path, {...opt, headers: {...HDR, ...(opt && opt.headers)}});
  if(r.status === 401 && localStorage.getItem("spi_token")){ clearSession(); refreshHeaderUI(); r = await fetch(path, {...opt, headers: {...HDR, ...(opt && opt.headers)}}); }
  return r;
}
function refreshHeaderUI(){
  const token = localStorage.getItem("spi_token"), name = localStorage.getItem("spi_name") || localStorage.getItem("spi_username");
  const lb = $("loginbtn");
  lb.textContent = token ? `${name} (sign out)` : "Sign in";
  lb.onclick = token ? doLogout : doLogin;
}
async function doLogin(){
  const username = prompt("Username"); if(!username) return;
  const password = prompt("Password"); if(!password) return;
  try{
    const r = await fetch("/auth/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({username, password})});
    if(!r.ok) throw new Error(r.status === 401 ? "invalid username or password" : `HTTP ${r.status}`);
    const data = await r.json();
    localStorage.setItem("spi_token", data.token);
    localStorage.setItem("spi_username", data.user.username);
    localStorage.setItem("spi_name", data.user.name || data.user.username);
    refreshAuth(); refreshHeaderUI();
    await init();
  }catch(e){ alert("Sign-in failed: " + e.message); }
}
async function doLogout(){
  try{ await fetch("/auth/logout", {method: "POST", headers: HDR}); }catch(e){}
  clearSession(); refreshHeaderUI();
  await init();
}
function fmtTime(ms){ return ms ? new Date(ms).toLocaleString() : ""; }
function rows(it){
  const rec = it.record, chg = new Map(it.changes.map(c => [c.key, c]));
  const row = (key, label, value) => {
    const c = chg.get(key);
    const val = c ? `<span class="old">${esc(c.old ?? "(none)")}</span><span class="arrow">&rarr;</span><span class="new">${esc(c.new ?? "")}</span>` : esc(value);
    return `<tr class="${c ? "chg" : ""}"><th>${esc(label)}</th><td>${val}</td></tr>`;
  };
  let h = row("job", "Job", rec.job) + row("job_version", "Job version", rec.job_version) + row("variant", "Variant", rec.variant || "-");
  if (rec.job_digest || chg.has("job_digest")) h += row("job_digest", "Job file digest", (rec.job_digest || "").slice(0, 16));
  h += rec.batch.map(f => row(f.key, f.label || f.key, f.value)).join("");
  // a field that is gone since the last accepted record
  h += it.changes.filter(c => c.new === null).map(c => `<tr class="chg"><th>${esc(c.label)}</th><td><span class="old">${esc(c.old)}</span><span class="arrow">&rarr;</span><span class="new">(removed)</span></td></tr>`).join("");
  return `<table>${h}</table>`;
}
function card(it, i){
  const [c, label] = STATE[it.state] || STATE.pending;
  const prev = it.previous ? `Compared with the record accepted by ${esc(it.previous.decided_name || "")} ${esc(fmtTime(it.previous.decided_at))} (code ${esc(it.previous.short_code)}).`
    : `<span class="first">Nothing was accepted on this station before: check every value.</span>`;
  const done = it.decided_by ? `<div class="meta">${esc(it.state === "accepted" ? "Accepted" : "Refused")} by ${esc(it.decided_name || it.decided_by)} ${esc(fmtTime(it.decided_at))}${it.note ? ": " + esc(it.note) : ""}</div>` : "";
  const acts = it.state === "pending" ? `
    <input class="note" maxlength="500" placeholder="Note (needed to refuse, max 500 characters)" data-note="${it.id}">
    <div class="acts"><button class="b-refuse" data-d="refuse">Refuse</button><button class="b-accept" data-d="accept">Accept</button></div>` : "";
  return `<div class="card" data-id="${it.id}">
    <div class="head"><span class="why">${esc(it.line)} &middot; ${esc(it.station)}</span><span class="code" title="First 8 characters of the code the line shows">${esc(it.short_code)}</span></div>
    <div class="meta">Operator ${esc(it.operator || "(nobody signed in)")} &middot; ${esc(fmtTime(it.asked_at))} &middot; ask ${it.ask} &middot; <span class="badge" style="--c:${c}">${esc(label)}</span></div>
    ${rows(it)}
    <div class="meta">${prev}</div>${done}${acts}</div>`;
}
function render(){
  $("grid").innerHTML = items.length ? items.map(card).join("") : `<div class="empty-msg">No changeover requests for this filter.</div>`;
}
let lastLoad = 0;
async function load(){
  lastLoad = Date.now();
  const q = new URLSearchParams({state: $("fstate").value, limit: 100});
  const [plant, line] = $("fline").value.split("|");
  if(line){ q.set("plant", plant); q.set("line", line); }
  const r = await api("/vision/changeover?" + q);
  if(!r.ok){ $("grid").innerHTML = `<div class="empty-msg">${r.status === 401 || r.status === 403 ? "Sign in with an account that can see this line." : "Cannot load requests (HTTP " + r.status + ")."}</div>`; items = []; return; }
  items = (await r.json()).items;
  render();
}
// Cards are found by the request's id, never by their place in the list: a refresh that brings a new request to the top
// must not move another station's request under the supervisor's click (four eyes). The confirmation names what is decided.
async function decide(id, decision){
  const it = items.find(x => String(x.id) === String(id)); if(!it || busy) return;
  const note = ((document.querySelector(`[data-note="${it.id}"]`) || {}).value || "").trim();
  if(decision === "refuse" && !note){ alert("A refusal needs a note: say what is wrong."); return; }
  if(!confirm(`${decision === "accept" ? "Accept" : "Refuse"} the changeover of ${it.line} · ${it.station}, code ${it.short_code}?`)) return;
  busy = true;
  try{
    const r = await api(`/vision/changeover/${it.id}/decide`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({decision, note})});
    if(!r.ok){
      const e = await r.json().catch(() => ({}));
      alert(r.status === 403 ? (e.detail || "Your account cannot decide this changeover.") : r.status === 409 ? (e.detail || "Already decided.") : "Not saved: " + (e.detail || r.status));
      await load(); return;
    }
    await load();
  } finally { busy = false; }
}
$("grid").addEventListener("click", ev => {
  const b = ev.target.closest("[data-d]"), c = ev.target.closest(".card"); if(!b || !c) return;
  decide(c.dataset.id, b.dataset.d);
});
["fline", "fstate"].forEach(id => $(id).onchange = load);
$("reload").onclick = () => { load(); settings(); };

// ---- the check on or off, for Admins ----
let master = null, forced = [];
async function settings(){
  const m = await api("/admin/master");
  if(!m.ok){ $("admin").hidden = true; return; }
  master = await m.json();
  const s = await api("/admin/vision/settings");
  if(!s.ok){ $("admin").hidden = true; return; }
  forced = (await s.json()).items.filter(x => x.key === "changeover_verify");
  const own = (plant, line) => (forced.find(x => x.plant === plant && x.line === line) || {}).value;
  const effective = (plant, line) => own(plant, line) ?? own(plant, null) ?? true;
  let h = "";
  for(const p of master.plants){
    h += setting(`Plant ${p.name || p.id}`, p.id, null, own(p.id, null) ?? true);
    for(const l of master.lines.filter(l => l.plant_id === p.id)) h += setting(`Line ${l.name || l.id}`, p.id, l.id, effective(p.id, l.id), own(p.id, l.id) === undefined);
  }
  $("settings").innerHTML = h;
  $("admin").hidden = false;
}
function setting(label, plant, line, on, inherited){
  return `<div class="set"><span>${esc(label)}</span><label><input type="checkbox" data-plant="${esc(plant)}" data-line="${esc(line || "")}"${on ? " checked" : ""}> check on</label>${inherited ? `<span class="meta">(from the plant)</span>` : ""}</div>`;
}
$("settings").addEventListener("change", async ev => {
  const b = ev.target.closest("input[data-plant]"); if(!b) return;
  const r = await api("/admin/vision/settings", {method: "PUT", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({key: "changeover_verify", plant: b.dataset.plant, line: b.dataset.line || null, value: b.checked})});
  if(!r.ok){ const e = await r.json().catch(() => ({})); alert("Not saved: " + (e.detail || r.status)); }
  await settings();
});

// The live floor (Req 17.3 LV-04): pushed over /vision/ws; while the socket is closed, GET /vision/floor every pollMs,
// and the socket is tried again after 2, 4, 8 .. at most 60 s.
function authQuery(){
  const t = localStorage.getItem("spi_token");
  if(t) return "&token=" + encodeURIComponent(t);
  if(KEY) return "&api_key=" + encodeURIComponent(KEY);
  return "";
}
function liveFloor(onFloor, pollMs){
  let ws = null, live = false, retry = 0, timer = null, gen = 0;
  setInterval(async () => {
    if(live || document.hidden) return;
    const r = await api("/vision/floor");
    if(r.ok && !live) onFloor(await r.json());
  }, pollMs);
  function connect(){
    const my = ++gen;
    clearTimeout(timer); live = false;
    if(ws){ ws.onclose = null; ws.close(); ws = null; }
    if(!("WebSocket" in window)) return;
    try{ ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/vision/ws?lang=en${authQuery()}`); }
    catch(e){ return; }
    ws.onopen = () => { live = true; retry = 0; };
    ws.onmessage = m => { const d = JSON.parse(m.data); if(d.type === "floor") onFloor(d.lines); };
    ws.onclose = () => { if(my !== gen) return; ws = null; live = false; timer = setTimeout(connect, Math.min(60000, 2000 * 2 ** retry++)); };
  }
  return {connect, isLive: () => live};
}
function fillLines(lines){
  const html = `<option value="">All lines</option>` + lines.map(l => `<option value="${esc(l.plant)}|${esc(l.line)}">${esc(l.line)}</option>`).join("");
  if($("fline").innerHTML === html) return;   // unchanged: never reset a list the user has open
  const cur = $("fline").value;
  $("fline").innerHTML = html;
  $("fline").value = cur;
}
function onFloor(lines){
  fillLines(lines);
  if(lastLoad && !document.hidden && !busy && $("fstate").value === "pending" && !document.activeElement.matches("input") && Date.now() - lastLoad >= 5000) load();
}
const floor = liveFloor(onFloor, 10000);
async function init(){
  refreshHeaderUI();
  const r = await api("/vision/floor");
  if(r.ok) onFloor(await r.json());
  floor.connect();   // again after a sign-in or sign-out, with the new credential
  await load(); settings();
}
init();
</script>
</body>
</html>
