<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>Print quality - Sundaram Smart Production Intelligence</title>
<style>
:root{--bg:#0b1220;--panel:#111a2e;--line:#1f2b46;--txt:#e5e9f2;--mut:#8fa0c0;--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--acc:#38bdf8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;background:#0e1730;border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.06em;font-size:13px;flex:1}.brand small{display:block;color:var(--mut);font-weight:500;letter-spacing:.02em}
.tab,button,select{background:#16213b;border:1px solid var(--line);color:var(--txt);padding:6px 12px;border-radius:6px;font:inherit}
button{cursor:pointer}
main{padding:14px 16px;max-width:1500px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.bar label{color:var(--mut);font-size:12px;display:flex;gap:6px;align-items:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.head{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin-bottom:4px}
.why{font-weight:600}.meta{color:var(--mut);font-size:12px}
.badge{display:inline-block;border-radius:4px;font-size:10px;font-weight:700;letter-spacing:.06em;padding:1px 7px;text-transform:uppercase;border:1px solid var(--c);color:var(--c)}
svg{width:100%;height:auto;display:block;margin:6px 0}
.empty-msg{color:var(--mut);padding:20px}
</style>
</head>
<body>
<header>
  <div class="brand">SUNDARAM SMART PRODUCTION INTELLIGENCE<small>Print quality: each tool's grade over time, against its lowest grade</small></div>
  <button class="tab" id="loginbtn"></button>
</header>
<main>
  <div class="bar">
    <label>Line <select id="fline"><option value="">All lines</option></select></label>
    <label>Period <select id="fperiod">
      <option value="3600000|60">Last hour</option><option value="21600000|300">Last 6 hours</option>
      <option value="86400000|3600" selected>Last 24 hours</option><option value="604800000|21600">Last 7 days</option></select></label>
    <button id="reload">Refresh</button>
  </div>
  <div class="grid" id="grid"><div class="empty-msg">Loading&hellip;</div></div>
</main>
<script>
"use strict";
const P = new URLSearchParams(location.search), KEY = P.get("key");
function authHeaders(){
  const t = localStorage.getItem("spi_token");
  if(t) return {"Authorization": "Bearer " + t};
  if(KEY) return {"X-API-Key": KEY};
  return {};
}
let HDR = authHeaders();
function refreshAuth(){ HDR = authHeaders(); }
function clearSession(){ localStorage.removeItem("spi_token"); localStorage.removeItem("spi_username"); localStorage.removeItem("spi_name"); refreshAuth(); }
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const LETTER = g => "FDCBA"[Math.max(0, Math.min(4, Math.floor(g + 1e-9)))];
const DRIFT = {drift:["#ef4444","Drifting to the lowest grade"], ok:["#22c55e","Steady"], too_few:["#8fa0c0","Too few graded parts yet"]};

async function api(path, opt){
  let r = await fetch(path, {...opt, headers: {...HDR, ...(opt && opt.headers)}});
  if(r.status === 401 && localStorage.getItem("spi_token")){ clearSession(); refreshHeaderUI(); r = await fetch(path, {...opt, headers: {...HDR, ...(opt && opt.headers)}}); }
  return r;
}
function refreshHeaderUI(){
  const token = localStorage.getItem("spi_token"), name = localStorage.getItem("spi_name") || localStorage.getItem("spi_username");
  const lb = $("loginbtn");
  lb.textContent = token ? `${name} (sign out)` : "Sign in";
  lb.onclick = token ? doLogout : doLogin;
}
async function doLogin(){
  const username = prompt("Username"); if(!username) return;
  const password = prompt("Password"); if(!password) return;
  try{
    const r = await fetch("/auth/login", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({username, password})});
    if(!r.ok) throw new Error(r.status === 401 ? "invalid username or password" : `HTTP ${r.status}`);
    const data = await r.json();
    localStorage.setItem("spi_token", data.token);
    localStorage.setItem("spi_username", data.user.username);
    localStorage.setItem("spi_name", data.user.name || data.user.username);
    refreshAuth(); refreshHeaderUI();
    await init();
  }catch(e){ alert("Sign-in failed: " + e.message); }
}
async function doLogout(){
  try{ await fetch("/auth/logout", {method: "POST", headers: HDR}); }catch(e){}
  clearSession(); refreshHeaderUI();
  await init();
}

// One chart per station and tool: the mean grade per bucket (line), the worst grade of the bucket (dots), the lowest grade
// (dashed red line). A bucket with an ungraded part gets an orange ring: it is never hidden (an ungraded part counts as F).
function chart(s, since, until, lowest){
  const W = 400, H = 140, L = 26, R = 8, T = 8, B = 18, span = Math.max(1, until - since);
  const x = t => L + (W - L - R) * Math.min(1, Math.max(0, (t - since) / span));
  const y = g => T + (H - T - B) * (1 - g / 4);
  let h = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grade trend of ${esc(s.tool)}">`;
  for(let g = 0; g <= 4; g++) h += `<line x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}" stroke="#1f2b46"/><text x="${L - 5}" y="${y(g) + 3}" fill="#8fa0c0" font-size="9" text-anchor="end">${LETTER(g)}</text>`;
  h += `<line class="lowest" x1="${L}" x2="${W - R}" y1="${y(lowest)}" y2="${y(lowest)}" stroke="#ef4444" stroke-dasharray="5 3"/>`;
  const pts = s.buckets.filter(b => b.mean !== null && b.mean !== undefined);
  if(pts.length > 1) h += `<polyline class="mean" fill="none" stroke="#38bdf8" stroke-width="2" points="${pts.map(b => x(b.start + 0) + "," + y(b.mean)).join(" ")}"/>`;
  for(const b of s.buckets){
    const cx = x(b.start);
    if(b.worst !== null && b.worst !== undefined) h += `<circle class="worst" cx="${cx}" cy="${y(b.worst)}" r="2.5" fill="${b.worst < lowest ? "#ef4444" : "#22c55e"}"/>`;
    if(b.ungraded > 0) h += `<circle class="ungraded" cx="${cx}" cy="${y(0)}" r="4" fill="none" stroke="#f59e0b" stroke-width="2"><title>${b.ungraded} not gradable (counted as F)</title></circle>`;
  }
  return h + `</svg>`;
}
function card(s, d, since, until, rule){
  const dr = s.drift, lowest = dr ? dr.lowest : rule.lowest_grade;
  const [c, label] = dr ? (DRIFT[dr.state] || DRIFT.too_few) : DRIFT.too_few;
  const total = s.buckets.reduce((n, b) => n + b.samples, 0), ung = s.buckets.reduce((n, b) => n + b.ungraded, 0);
  const meta = dr && dr.mean !== null ? `Latest ${dr.samples} parts: mean ${dr.mean.toFixed(2)} (${LETTER(dr.mean)}), ${dr.slope >= 0 ? "+" : ""}${dr.slope.toFixed(3)} per part. ` : "";
  return `<div class="card" data-tool="${esc(s.tool)}">
    <div class="head"><span class="why">${esc(s.line)} &middot; ${esc(s.station)} &middot; ${esc(s.tool)}</span><span class="badge" style="--c:${c}">${esc(label)}</span></div>
    ${chart(s, since, until, lowest)}
    <div class="meta">${esc(meta)}Lowest grade ${LETTER(lowest)} (${lowest}, ${dr && dr.lowest_from === "station" ? "set at the station" : "the plant rule"}). ${total} parts in this period${ung ? `, <b>${ung} not gradable</b>` : ""}.</div></div>`;
}
function render(data){
  const rows = data.series;
  $("grid").innerHTML = rows.length ? rows.map(s => card(s, s.drift, data.since, data.until, data.rule)).join("")
    : `<div class="empty-msg">No graded parts in this period.</div>`;
}
let lastLoad = 0, partsKey = null;
async function load(){
  lastLoad = Date.now();
  const [span, bucket] = $("fperiod").value.split("|");
  const until = Date.now(), q = new URLSearchParams({since: until - Number(span), until, bucket_s: bucket});
  const [plant, line] = $("fline").value.split("|");
  if(line){ q.set("plant", plant); q.set("line", line); }
  const r = await api("/vision/grades/trend?" + q);
  if(!r.ok){ $("grid").innerHTML = `<div class="empty-msg">${r.status === 401 || r.status === 403 ? "Sign in with an account that can see this line." : "Cannot load the print quality (HTTP " + r.status + ")."}</div>`; return; }
  render(await r.json());
}
["fline", "fperiod"].forEach(id => $(id).onchange = load);
$("reload").onclick = load;
// The live floor (Req 17.3 LV-04): pushed over /vision/ws; while the socket is closed, GET /vision/floor every pollMs,
// and the socket is tried again after 2, 4, 8 .. at most 60 s.
function authQuery(){
  const t = localStorage.getItem("spi_token");
  if(t) return "&token=" + encodeURIComponent(t);
  if(KEY) return "&api_key=" + encodeURIComponent(KEY);
  return "";
}
function liveFloor(onFloor, pollMs){
  let ws = null, live = false, retry = 0, timer = null, gen = 0;
  setInterval(async () => {
    if(live || document.hidden) return;
    const r = await api("/vision/floor");
    if(r.ok && !live) onFloor(await r.json());
  }, pollMs);
  function connect(){
    const my = ++gen;
    clearTimeout(timer); live = false;
    if(ws){ ws.onclose = null; ws.close(); ws = null; }
    if(!("WebSocket" in window)) return;
    try{ ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/vision/ws?lang=en${authQuery()}`); }
    catch(e){ return; }
    ws.onopen = () => { live = true; retry = 0; };
    ws.onmessage = m => { const d = JSON.parse(m.data); if(d.type === "floor") onFloor(d.lines); };
    ws.onclose = () => { if(my !== gen) return; ws = null; live = false; timer = setTimeout(connect, Math.min(60000, 2000 * 2 ** retry++)); };
  }
  return {connect, isLive: () => live};
}
function fillLines(lines){
  const html = `<option value="">All lines</option>` + lines.map(l => `<option value="${esc(l.plant)}|${esc(l.line)}">${esc(l.line)}</option>`).join("");
  if($("fline").innerHTML === html) return;   // unchanged: never reset a list the user has open
  const cur = $("fline").value;
  $("fline").innerHTML = html;
  $("fline").value = cur;
}
function onFloor(lines){
  fillLines(lines);
  const key = lines.map(l => `${l.plant}|${l.line}|${l.total}`).join(";"), since = Date.now() - lastLoad;
  if(partsKey !== null && !document.hidden && ((key !== partsKey && since >= 15000) || since >= 60000)) load();
  partsKey = key;
}
const floor = liveFloor(onFloor, 60000);
async function init(){
  refreshHeaderUI();
  const r = await api("/vision/floor");
  if(r.ok) onFloor(await r.json());
  floor.connect();   // again after a sign-in or sign-out, with the new credential
  await load();
}
init();
</script>
</body>
</html>
