<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile: settings, colour mode and sounds</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7CB7FF}a:hover{color:#A9CFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: {{t.page}}; color: {{t.ink}}; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; transition: background 300ms, color 300ms">
  <header style="padding: 20px 20px 8px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700">Settings</h1>
  </header>
  <div style="flex: 1; padding: 8px 20px; display: flex; flex-direction: column; gap: 18px">
    <section aria-label="Colour mode">
      <div style="font-weight: 600; font-size: 15px; margin-bottom: 8px">Colour mode</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid {{t.border}}; border-radius: 14px; overflow: hidden">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
          <button onClick="{{m.pick}}" aria-pressed="{{m.on}}" style="height: 52px; border: 0; font: inherit; font-size: 15px; font-weight: 600; background: {{m.bg}}; color: {{m.fg}}">{{m.label}}</button>
        </sc-for>
      </div>
      <div style="font-size: 13px; color: {{t.muted}}; margin-top: 6px">Dark is the floor look. Phone follows your phone's setting.</div>
    </section>

    <section aria-label="Sounds" style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
      <div style="flex: 1">
        <div style="font-weight: 600; font-size: 16px">Sounds</div>
        <div style="font-size: 13px; color: {{t.muted}}">Taps and alarms. Quiet when your phone is on silent.</div>
      </div>
      <button onClick="{{toggleSound}}" role="switch" aria-checked="{{sound}}" aria-label="Sounds" style="width: 60px; height: 34px; border-radius: 17px; border: 0; position: relative; background: {{switchBg}}">
        <span style="position: absolute; top: 4px; left: {{knob}}; width: 26px; height: 26px; border-radius: 13px; background: #FFFFFF; transition: left 150ms"></span>
      </button>
    </section>

    <section aria-label="Alarm sounds">
      <div style="font-weight: 600; font-size: 15px; margin-bottom: 8px">Hear the alarm sounds</div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
          <button onClick="{{l.play}}" style="display: flex; align-items: center; gap: 12px; text-align: left; background: {{t.card}}; color: {{t.ink}}; border: 1px solid {{t.line}}; border-radius: 14px; padding: 12px 14px; min-height: 64px; font: inherit">
            <span style="flex: 0 0 auto; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; background: {{l.bg}}; color: {{l.fg}}">{{l.shape}}</span>
            <span style="flex: 1"><span style="display: block; font-weight: 600">{{l.name}}</span><span style="display: block; font-size: 13px; color: {{t.muted}}">{{l.desc}}</span></span>
            <span style="font-size: 13px; color: {{t.brand}}">{{l.state}}</span>
          </button>
        </sc-for>
      </div>
    </section>
  </div>
  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: {{t.card}}; border-top: 1px solid {{t.line}}; padding: 6px 4px 18px">
    <a href="MobileLines.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: {{t.muted}}; font-size: 12px; padding: 8px 0; min-height: 48px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 21V10l6 4V10l6 4V6l6 4v11z"></path></svg>Plants</a>
    <a href="MobileSettings.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; text-decoration: none; color: {{t.brand}}; font-size: 12px; padding: 8px 0; min-height: 48px">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg>Settings</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { mode: 'dark', sound: true, played: '' }; }
  renderVals() {
    const dark = { page: '#0B1117', card: '#131C25', ink: '#E6EDF3', muted: '#9FB0C0', line: '#22303D', border: '#5A7088', brand: '#7CB7FF', onBrand: '#06111F', ok: '#3FB950', warn: '#E3B341', ng: '#FF7B72', okBg: '#12301B', warnBg: '#2A2412', ngBg: '#3A1D1B', sunken: '#1A2633' };
    const light = { page: '#EEF2F7', card: '#FFFFFF', ink: '#0E1A2B', muted: '#4F6178', line: '#D5DEE9', border: '#6B7E98', brand: '#1B4F9C', onBrand: '#FFFFFF', ok: '#0B7A3B', warn: '#8A5300', ng: '#C8283A', okBg: '#DDF3E4', warnBg: '#FCEFD3', ngBg: '#FBE3E5', sunken: '#E6ECF4' };
    const t = this.state.mode === 'light' ? light : dark; // "Phone" shows dark here, as a dark phone would
    const modes = [['dark', 'Dark'], ['light', 'Light'], ['phone', 'Phone']].map(([id, label]) => {
      const on = this.state.mode === id;
      return { label, on: on ? 'true' : 'false', bg: on ? t.brand : t.card, fg: on ? t.onBrand : t.ink, pick: () => this.setState({ mode: id }) };
    });
    const levels = [
      { id: 'low', name: 'Low', desc: 'One soft note, no vibration', shape: '–', bg: t.sunken, fg: t.muted },
      { id: 'medium', name: 'Medium', desc: 'Two rising notes, double vibration', shape: '!', bg: t.warnBg, fg: t.warn },
      { id: 'high', name: 'High', desc: 'Three short pulses, three firm vibrations', shape: '✗', bg: t.ngBg, fg: t.ng },
    ].map(l => ({ ...l, state: this.state.played === l.id ? (this.state.sound ? '♪ playing' : 'vibrate only') : 'Play', play: () => this.setState({ played: l.id }) }));
    return {
      t, modes, levels, sound: this.state.sound ? 'true' : 'false',
      switchBg: this.state.sound ? t.ok : t.border, knob: this.state.sound ? '30px' : '4px',
      toggleSound: () => this.setState({ sound: !this.state.sound }),
    };
  }
}
</script>
</body>
</html>
