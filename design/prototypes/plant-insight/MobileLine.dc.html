<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile: line</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7CB7FF}a:hover{color:#A9CFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; background: #0E151C; color: #E6EDF3; font-family: 'IBM Plex Sans', system-ui, sans-serif; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden">
  <header style="padding: 16px 16px 8px; display: flex; align-items: center; gap: 8px">
    <a href="MobileLines.dc.html" aria-label="Back to my lines" style="display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; color: #E6EDF3">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a>
    <div style="flex: 1; min-width: 0">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700">Line 4</h1>
      <div style="font-size: 13px; color: #9FB0C0">Carton print · 30 ct</div>
    </div>
    <span style="background: #12301B; color: #3FB950; border: 1px solid #2B6A3A; border-radius: 999px; padding: 6px 12px; font-weight: 600; font-size: 14px">✓ Running</span>
  </header>
  <div style="flex: 1; overflow: hidden; padding: 8px 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="position: relative; height: 200px; background: #1B2733; border: 6px solid #3FB950; border-radius: 14px; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
      <svg width="70%" viewBox="0 0 280 180" role="img" aria-label="Live picture of the carton, all checks good">
        <rect x="20" y="20" width="240" height="140" rx="6" fill="#2A3846" stroke="#4A5E72"></rect>
        <rect x="40" y="40" width="110" height="18" rx="3" fill="#5A7088"></rect>
        <rect x="190" y="40" width="50" height="50" fill="none" stroke="#7CB7FF" stroke-width="2" stroke-dasharray="4 3"></rect>
        <rect x="38" y="100" width="150" height="34" fill="none" stroke="#3FB950" stroke-width="3"></rect>
      </svg>
      <span style="position: absolute; top: 8px; left: 12px; font-family: 'IBM Plex Mono', monospace; font-size: 32px; font-weight: 600; color: #3FB950">OK</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
      <div style="background: #16212C; border: 1px solid #22303D; border-radius: 12px; padding: 10px 12px"><div style="font-size: 12px; color: #9FB0C0">Good</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: #3FB950">38,412</div></div>
      <div style="background: #16212C; border: 1px solid #22303D; border-radius: 12px; padding: 10px 12px"><div style="font-size: 12px; color: #9FB0C0">NG</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600; color: #FF7B72">388</div></div>
      <div style="background: #16212C; border: 1px solid #22303D; border-radius: 12px; padding: 10px 12px"><div style="font-size: 12px; color: #9FB0C0">Yield</div><div style="font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 600">99.0%</div></div>
    </div>
    <div style="background: #2A2412; border: 1px solid #6B5317; border-radius: 12px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start">
      <span style="flex: 0 0 auto; width: 32px; height: 32px; border-radius: 8px; background: #E3B341; color: #0E151C; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px">!</span>
      <div><div style="font-weight: 600; font-size: 15px">Label is moving to the right</div><div style="font-size: 14px; color: #D8C9A0">Still good. Check the label guide at the next stop.</div></div>
    </div>
    <div>
      <div style="font-size: 15px; font-weight: 600; margin-bottom: 8px">Last NG parts</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{ngs}}" as="n" hint-placeholder-count="3">
          <a href="MobileReview.dc.html" style="display: block; text-decoration: none; color: #E6EDF3; background: #1B2733; border: 1px solid #3A2A2A; border-radius: 10px; overflow: hidden">
            <div style="height: 52px; background: #2A3846; display: flex; align-items: center; justify-content: center; color: #FF7B72; font-weight: 700; font-size: 20px">✗</div>
            <div style="padding: 6px 8px; font-size: 12px; line-height: 1.3">{{n}}</div>
          </a>
        </sc-for>
      </div>
    </div>
  </div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 8px 16px 20px">
    <button style="height: 64px; background: #16212C; color: #E6EDF3; border: 1px solid #2C3C4B; border-radius: 14px; font: inherit; font-size: 14px; font-weight: 600">Change product</button>
    <button style="height: 64px; background: #16212C; color: #E6EDF3; border: 1px solid #2C3C4B; border-radius: 14px; font: inherit; font-size: 14px; font-weight: 600">Why stopped?</button>
    <button style="height: 64px; background: #3A1D1B; color: #FFB4AE; border: 1px solid #7A2F2A; border-radius: 14px; font: inherit; font-size: 14px; font-weight: 600">Call supervisor</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return { ngs: ['Label offset too large', 'Date not readable', 'Code not found'] };
  }
}
</script>
</body>
</html>
