[project]
name = "vision_licence"
authors = [{ name = "Sundaram Tech" }]
description = "Licence server for Vision Studio: verifies licences and part serial numbers against ERPNext"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
